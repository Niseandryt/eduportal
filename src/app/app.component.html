<ion-app>
  @if (auth.isAuthenticated()) {
    <ion-split-pane contentId="main-content">
      <ion-menu contentId="main-content" type="overlay">
        <ion-content>
          <ion-list id="inbox-list">
            <ion-list-header>EduPortal</ion-list-header>
            <ion-note>{{ auth.user()?.email }}</ion-note>

            @for (p of appPages(); track p.url) {
              <ion-menu-toggle auto-hide="false">
                <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                  <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }
          </ion-list>

          <ion-list id="labels-list">
            <ion-list-header>{{ auth.esMaestro() ? 'Maestro' : 'Alumno' }}</ion-list-header>
            <ion-menu-toggle auto-hide="false">
              <ion-item button lines="none" detail="false" (click)="cerrarSesion()">
                <ion-icon aria-hidden="true" slot="start" ios="log-out-outline" md="log-out-sharp"></ion-icon>
                <ion-label>Cerrar sesion</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        </ion-content>
      </ion-menu>
      <ion-router-outlet id="main-content"></ion-router-outlet>
    </ion-split-pane>
  } @else {
    <ion-router-outlet></ion-router-outlet>
  }
</ion-app>
