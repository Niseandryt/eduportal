<ion-content class="ion-padding">
  <div class="login-contenedor">
    <ion-card>
      <ion-card-header>
        <ion-card-title>EduPortal</ion-card-title>
        <ion-card-subtitle>Inicia sesion para continuar</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="entrar()">
          <ion-item>
            <ion-input
              label="Correo electronico"
              labelPlacement="floating"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
            ></ion-input>
          </ion-item>
          <ion-item>
            <ion-input
              label="Contrasena"
              labelPlacement="floating"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
            ></ion-input>
          </ion-item>

          @if (error()) {
            <ion-note color="danger" class="ion-padding-top">{{ error() }}</ion-note>
          }

          <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando()">
            @if (cargando()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              Entrar
            }
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
